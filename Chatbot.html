<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function Button({ timesClicked, handleClicks }) {
        return (
          <>
            <button onClick={handleClicks}>
              Clicked {timesClicked} {timesClicked === 1 ? "time" : "times"}
            </button>
          </>
        );
      }
      function App() {
        const [timesClicked, setTimesClicked] = React.useState(0);
        function handleClicks() {
          setTimesClicked(timesClicked + 1);
        }
        function resetTimesClicked() {
          setTimesClicked(0);
        }
        return (
          <>
            <Button timesClicked={timesClicked} handleClicks={handleClicks} />
            <Button timesClicked={timesClicked} handleClicks={handleClicks} />
            <button onClick={resetTimesClicked}>Reset</button>
          </>
        );
      }
      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
